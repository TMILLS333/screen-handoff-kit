<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a demo</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f5f5; margin: 0; padding: 40px 16px; }
  .card { max-width: 480px; margin: 0 auto; background: #fff; padding: 32px; border-radius: 12px; }
  h1 { margin-top: 0; font-size: 24px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  button { margin-top: 24px; width: 100%; padding: 12px; background: #2b59c3; color: #fff; border: 0; border-radius: 6px; font-size: 16px; cursor: pointer; }
  #thanks { display: none; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <div id="formWrap">
    <h1>Request a demo</h1>
    <p>Tell us about your team and we'll be in touch.</p>
    <!-- TODO: hook up to form tool before launch -->
    <form id="demoForm" action="https://forms.formtool.example/f/REPLACE_ME" method="post">
      <label for="name">Full name</label>
      <input id="name" name="name" required>

      <label for="email">Work email</label>
      <input id="email" name="email" type="email" required>

      <label for="company">Company</label>
      <input id="company" name="company" required>

      <label for="size">Team size</label>
      <select id="size" name="size">
        <option>1-10</option>
        <option>11-50</option>
        <option>51-200</option>
        <option>200+</option>
      </select>

      <label for="msg">What do you want to see?</label>
      <textarea id="msg" name="msg" rows="4"></textarea>

      <button type="submit">Request demo</button>
    </form>
  </div>
  <div id="thanks">
    <h1>Thanks!</h1>
    <p>We'll reach out soon.</p>
  </div>
</div>
<script>
  // Prototype only: skip the real submit and show the thank-you message.
  document.getElementById('demoForm').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('formWrap').style.display = 'none';
    document.getElementById('thanks').style.display = 'block';
  });
</script>
</body>
</html>
